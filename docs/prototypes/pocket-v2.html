<div class="bulkbar" id="bulkbar"><div class="bulkcopy"><span id="bulkcount"></span><small id="bulkhint"></small></div><button class="primarybtn" id="chooseDate" type="button">選擇日期</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="toastbadge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fffaf2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="toastmessage" id="toastmessage"></span><button class="toastaction" id="toastaction" type="button" hidden></button></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle" hidden></section>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
const svg=(path,size=16,width=2)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
const I={
  up:'<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',
  down:'<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', close:'<path d="M18 6 6 18M6 6l12 12"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  calendarPlus:'<path d="M16 2v4M8 2v4M3 10h18"/><path d="M19 14v6M16 17h6"/><path d="M21 12V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h8"/>',
  calendarClock:'<path d="M16 14v2.2l1.6 1"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M21 12.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h7.5"/><circle cx="16" cy="16" r="5"/>',
  calendarCheck:'<path d="M16 2v4M8 2v4M3 10h18"/><path d="M21 12V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h8"/><path d="m16 19 2 2 4-4"/>',
  mapPinOff:'<path d="M9.8 4.2A8 8 0 0 1 20 12c0 2-1 3.5-2 5"/><path d="M14.5 20.5c-.9.8-1.8 1.4-2.5 1.9C10 21 4 17 4 12a8 8 0 0 1 1.2-4.2"/><path d="m2 2 20 20"/>',
  mapPin:'<path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>', link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
  chevron:'<path d="m9 18 6-6-6-6"/>'
};
const days=[['10/21','週三'],['10/22','週四'],['10/23','週五'],['10/24','週六'],['10/25','週日'],['10/26','週一']];
let places=[
  {id:'kiyomizu',name:'清水寺',kind:'佛寺',reason:'想帶媽媽看看京都最經典的舞台，也順路走二年坂。',located:true,day:null,photo:'photo-assets/kiyomizu.jpg',yes:3,no:0,mine:'yes'},
  {id:'fushimi',name:'伏見稲荷大社',kind:'神社',reason:'想早一點去千本鳥居拍照，不一定要走到山頂。',located:true,day:null,photo:null,yes:2,no:0,mine:null},
  {id:'nishiki',name:'錦市場',kind:'市場',reason:'大家可以各自挑想吃的小吃，再一起找地方休息。',located:true,day:null,photo:null,yes:2,no:1,mine:null},
  {id:'tofukuji',name:'東福寺',kind:'佛寺',reason:'通天橋和庭園都想慢慢看，已先排在第二天上午。',located:true,day:'10/22',photo:'photo-assets/tofukuji.jpg',yes:1,no:0,mine:null},
  {id:'friend-cafe',name:'朋友推薦的咖啡店',kind:'咖啡',reason:'還沒寫原因',located:false,day:null,photo:null,yes:1,no:0,mine:null,emptyReason:true},
  {id:'tamagoyaki',name:'媽媽說的玉子燒店',kind:'餐廳',reason:'媽媽說以前吃過，但不記得店名和地址。',located:false,day:null,photo:null,yes:3,no:0,mine:'yes'}
];
let selecting=false,selected=new Set(),openKind=null,openId=null,scheduleIds=[],selectedDay=null,changingDate=false,addMode='search',addResult=null,highlightedIds=new Set(),lastFocus=null,toastPlaceId=null,locationId=null,locationResult=null;
const params=new URLSearchParams(location.search),demoState=params.get('state')||'default';
function statusFor(p){if(!p.located)return{icon:I.mapPinOff,text:'缺少位置',cls:' missing'};if(p.day)return{icon:I.calendarCheck,text:`已排入 ${p.day}（${days.find(d=>d[0]===p.day)?.[1]||''}）`,cls:' done'};return{icon:I.calendarClock,text:'尚未排入',cls:''}}
function thumb(p,detail=false){const cls=detail?'detailphoto':'thumb';return p.photo?`<div class="${cls}"><img src="${p.photo}" alt="${esc(p.name)}"></div>`:`<div class="${cls}"><div class="nophoto">${svg(I.image,detail?26:20)}<span>尚無可用照片</span></div></div>`}
function checkbox(p,where='mobile'){const disabled=!p.located||!!p.day;return `<button class="check ${where==='mobile'?'mobilecheck':''}" type="button" role="checkbox" data-select="${esc(p.id)}" aria-checked="${selected.has(p.id)}" aria-label="選擇 ${esc(p.name)}" ${disabled?'disabled':''}>${svg(I.check,16,3)}</button>`}
function votes(p,side=false){return `<div class="votes${side?' sidevotes':''}" aria-label="對「${esc(p.name)}」表態"><button class="vote up" type="button" data-vote="yes" data-id="${esc(p.id)}" aria-pressed="${p.mine==='yes'}" aria-label="想去，${p.yes} 人">${svg(I.up,15)}<span>${p.yes}</span></button><button class="vote down" type="button" data-vote="no" data-id="${esc(p.id)}" aria-pressed="${p.mine==='no'}" aria-label="不想去，${p.no} 人">${svg(I.down,15)}<span>${p.no}</span></button></div>`}
function render(){
  $('pagehead').classList.toggle('is-selecting',selecting);
  $('pagehead').innerHTML=selecting?`<h1>已選 ${selected.size} 個</h1><div class="selecthead"><button class="ghostbtn" id="cancelSelect" type="button">${svg(I.close,16)}取消</button></div>`:`<div class="titlegroup"><h1>口袋名單</h1><p class="pagehelper">大家一起表態的候選地點；排入行程時再選日期。</p></div><div class="headbuttons"><button class="primarybtn" id="startSelect" type="button">${svg(I.calendarPlus,16)}排入行程</button><button class="secondarybtn" id="openAdd" type="button">${svg(I.plus,16)}加入地點</button></div>`;
  $('list').innerHTML=places.map(p=>{
    const status=statusFor(p),selectable=p.located&&!p.day;
    const statusLine=`<div class="statusrow"><span class="statusmeta${status.cls}">${svg(status.icon,15)}${status.text}</span>${!p.located?`<button class="outlinebtn" type="button" data-location="${esc(p.id)}">${svg(I.mapPin,15)}補上位置</button>`:''}</div>`;
    return `<article class="row${p.day?' scheduled':''}${selecting?' selecting':''}${selectable?' is-selectable':''}${selected.has(p.id)?' is-selected':''}${highlightedIds.has(p.id)?' just-added':''}${openKind==='detail'&&openId===p.id?' open':''}" data-row="${esc(p.id)}" ${selecting?'':`tabindex="0" aria-haspopup="dialog"`}><div class="lead">${selecting?checkbox(p,'desktop'):''}</div>${thumb(p)}<div class="rowcontent"><div class="titleline"><h2>${esc(p.name)}</h2><span class="chip">${esc(p.kind)}</span><span class="spacer"></span>${selecting?checkbox(p):''}</div><p class="desc${p.emptyReason?' nodesc':''}">${esc(p.reason)}</p>${statusLine}<div class="rowbottom">${votes(p)}</div></div>${votes(p,true)}</article>`}).join('');
  const missingCount=places.filter(p=>!p.located).length;$('bulkbar').classList.toggle('show',selecting);$('bulkcount').textContent=`已選 ${selected.size} 個`;$('bulkhint').textContent=missingCount?`${missingCount} 個地點補上位置後才能排入行程`:'';$('chooseDate').disabled=selected.size===0;
  if(openKind==='detail')renderDetail();
  highlightedIds.clear();
}
function showSheet(kind,trigger){openKind=kind;lastFocus=trigger||document.activeElement;const sheet=$('sheet');sheet.hidden=false;if(kind==='detail')renderDetail();if(kind==='schedule')renderSchedule();if(kind==='add')renderAdd();if(kind==='location')renderLocation();requestAnimationFrame(()=>{sheet.classList.add('show');$('scrim').classList.add('show');$('sheettitle')?.focus({preventScroll:true})})}
function closeSheet(){const sheet=$('sheet');sheet.classList.remove('show');$('scrim').classList.remove('show');openKind=null;openId=null;setTimeout(()=>{if(!openKind)sheet.hidden=true},430);render();lastFocus?.focus?.({preventScroll:true})}
function switchSheet(kind){openKind=kind;if(kind==='schedule')renderSchedule();if(kind==='add')renderAdd();if(kind==='location')renderLocation();$('sheettitle')?.focus({preventScroll:true})}
function renderDetail(){const p=places.find(x=>x.id===openId);if(!p)return;const status=statusFor(p),action=!p.located?'補上位置':p.day?'更改日期':'排入行程',actionIcon=!p.located?I.mapPin:I.calendarPlus;$('sheet').innerHTML=`<div class="grab" aria-hidden="true"></div><header class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">${esc(p.name)}</h2><div class="sheetheadmeta"><span class="chip">${esc(p.kind)}</span><span class="headstatus${status.cls}">${svg(status.icon,15)}${status.text}</span></div></div><button class="iconbtn" type="button" data-close aria-label="關閉">${svg(I.close,20)}</button></header><div class="sheetbody">${thumb(p,true)}<section class="sec"><h3>為什麼想去</h3><p class="detaildesc${p.emptyReason?' nodesc':''}">${p.emptyReason?'還沒寫原因':esc(p.reason)}</p></section><section class="sec"><h3>排入行程</h3><button class="primarybtn detailaction" type="button" data-detail-action="${esc(p.id)}">${svg(actionIcon,18)}${action}</button></section><section class="sec"><h3>地點資訊</h3><p class="detaildesc mutednote">${p.located?'京都市・位置已確認':'還沒有可用的位置資料。補上位置後才能選擇日期。'}</p></section></div><footer class="sheetfoot">${votes(p)}</footer>`}
function openSchedule(ids,change=false,trigger){scheduleIds=[...ids];selectedDay=null;changingDate=change;showSheet('schedule',trigger)}
function renderSchedule(){const chosen=places.filter(p=>scheduleIds.includes(p.id));const names=chosen.map(p=>esc(p.name)).join('、');const single=chosen.length===1;const dayLabel=selectedDay&&selectedDay!=='none'?`${selectedDay}（${days.find(d=>d[0]===selectedDay)?.[1]}）`:null;let buttonLabel='先選擇日期';if(selectedDay==='none')buttonLabel=`將「${esc(chosen[0]?.name||'')}」設為先不安排`;else if(dayLabel)buttonLabel=single?`將「${esc(chosen[0].name)}」排入 ${dayLabel}`:`將 ${chosen.length} 個地點排入 ${dayLabel}`;$('sheet').innerHTML=`<div class="grab" aria-hidden="true"></div><header class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">排入行程</h2><p>${names}</p></div><button class="iconbtn" type="button" data-close aria-label="關閉">${svg(I.close,20)}</button></header><div class="sheetbody"><section class="sec" style="padding-top:4px"><h3>選擇日期</h3><div class="daypicker" aria-label="排入哪一天">${changingDate?`<button class="daypick unschedule" type="button" data-day="none" aria-pressed="${selectedDay==='none'}"><span>先不安排</span><small>保留在行程</small></button>`:''}${days.map(day=>`<button class="daypick" type="button" data-day="${day[0]}" aria-pressed="${selectedDay===day[0]}"><span>${day[0]}</span><small>${day[1]}</small></button>`).join('')}</div></section></div><footer class="sheetfoot"><button class="primarybtn" id="confirmSchedule" type="button" ${selectedDay?'':'disabled'}>${buttonLabel}</button></footer>`}
function renderAdd(){const tab=(key,label,icon)=>`<button type="button" role="tab" data-add-mode="${key}" aria-selected="${addMode===key}">${svg(icon,18)}${label}</button>`;let body='';if(addMode==='manual'){body=`<p class="addintro">適合加入朋友推薦，或暫時在地圖上找不到的地點。自己輸入的地點需要之後補上位置。</p><form id="manualForm"><div class="formgrid"><div class="field"><label for="manualName">名稱</label><input id="manualName" required maxlength="80" placeholder="地點名稱"></div><div class="field"><label for="manualKind">類型</label><select id="manualKind"><option>景點</option><option>餐廳</option><option>咖啡</option><option>其他</option></select></div><div class="field"><label for="manualReason">為什麼想去？</label><textarea id="manualReason" placeholder="選填"></textarea></div></div><div class="addactions"><button class="primarybtn" type="submit">${svg(I.plus,18)}存到口袋名單</button></div></form>`}else{const isLink=addMode==='link';body=`<p class="addintro">${isLink?'貼上 Google Maps 分享連結，確認找到的地點後再加入。':'用地點名稱搜尋，再確認正確的結果。'}</p><div class="searchline"><input id="addQuery" aria-label="${isLink?'Google Maps 連結':'搜尋地點'}" placeholder="${isLink?'貼上 maps.app.goo.gl 連結':'例如：京都御苑'}"><button class="secondarybtn searchbutton" id="findPlace" type="button" aria-label="搜尋">${svg(I.search,19)}</button></div>${addResult?`<div class="result"><div class="resultrow"><strong>${esc(addResult.name)}</strong><span>${esc(addResult.address)}</span></div><div class="field" style="margin-top:14px"><label for="foundReason">為什麼想去？</label><textarea id="foundReason" placeholder="選填"></textarea></div><div class="addactions"><button class="primarybtn" id="addFound" type="button">${svg(I.plus,18)}存到口袋名單</button></div></div>`:''}`}$('sheet').innerHTML=`<div class="grab" aria-hidden="true"></div><header class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">加入地點</h2><p>加入後會成為全家都能表態的候選地點。</p></div><button class="iconbtn" type="button" data-close aria-label="關閉">${svg(I.close,20)}</button></header><div class="sheetbody"><div class="addtabs" role="tablist" aria-label="加入方式">${tab('search','搜尋',I.search)}${tab('link','貼連結',I.link)}${tab('manual','自己輸入',I.pencil)}</div>${body}</div>`}
function renderLocation(){const p=places.find(item=>item.id===locationId);if(!p)return;const result=locationResult?`<div class="result"><div class="resultrow"><strong>${esc(locationResult.name)}</strong><span>${esc(locationResult.address)}</span></div><div class="addactions"><button class="primarybtn" id="useLocation" type="button">${svg(I.mapPin,18)}用這個位置</button></div></div>`:'';$('sheet').innerHTML=`<div class="grab" aria-hidden="true"></div><header class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">補上位置</h2><p>${esc(p.name)}</p></div><button class="iconbtn" type="button" data-close aria-label="關閉">${svg(I.close,20)}</button></header><div class="sheetbody"><p class="addintro">搜尋確切店名，或貼上 Google Maps 分享連結，再確認正確的位置。</p><div class="searchline"><input id="locationQuery" aria-label="搜尋店名或 Google Maps 連結" placeholder="搜尋店名，或貼上 Google Maps 連結"><button class="secondarybtn searchbutton" id="findLocation" type="button" aria-label="搜尋">${svg(I.search,19)}</button></div>${result}</div>`}
function openLocation(id,trigger){locationId=id;locationResult=null;if(openKind)switchSheet('location');else showSheet('location',trigger)}
function showToast(message,actionLabel='',placeId=null,keep=false){$('toastmessage').textContent=message;const action=$('toastaction');toastPlaceId=placeId;if(actionLabel){action.hidden=false;action.textContent=actionLabel}else action.hidden=true;const toast=$('toast');toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');clearTimeout(window.__toast);if(!keep)window.__toast=setTimeout(()=>toast.classList.remove('show'),4800)}
function addPlace(name,kind,reason,located){const p={id:`new-${Date.now()}`,name,kind,reason:reason||'還沒寫原因',emptyReason:!reason,located,day:null,photo:null,yes:0,no:0,mine:null};places.unshift(p);highlightedIds=new Set([p.id]);const sheet=$('sheet');sheet.classList.remove('show');$('scrim').classList.remove('show');openKind=null;setTimeout(()=>{if(!openKind)sheet.hidden=true},430);render();requestAnimationFrame(()=>document.querySelector(`[data-row="${p.id}"]`)?.scrollIntoView({block:'center',behavior:'smooth'}));showToast(`已將「${name}」存到口袋名單`,located?'接著排入行程':'補上位置',p.id)}
function confirmSchedule(){if(!selectedDay)return;const chosen=places.filter(p=>scheduleIds.includes(p.id));if(selectedDay==='none'){chosen.forEach(p=>p.day=null);closeSheet();showToast(`已將「${chosen[0].name}」設為先不安排`);return}chosen.forEach(p=>{p.day=selectedDay});const count=chosen.length,label=`${selectedDay}（${days.find(d=>d[0]===selectedDay)?.[1]}）`;highlightedIds=new Set(chosen.map(p=>p.id));selected.clear();selecting=false;const sheet=$('sheet');sheet.classList.remove('show');$('scrim').classList.remove('show');openKind=null;setTimeout(()=>sheet.hidden=true,430);render();showToast(`已將 ${count} 個地點排入 ${label}`,'查看行程',null)}
function toggleSelected(id){const p=places.find(x=>x.id===id);if(!p||!p.located||p.day)return;selected.has(id)?selected.delete(id):selected.add(id);render()}
document.addEventListener('click',event=>{
  const vote=event.target.closest('[data-vote]');if(vote){event.stopPropagation();const p=places.find(x=>x.id===vote.dataset.id),kind=vote.dataset.vote;if(!p)return;if(p.mine===kind){p[kind]--;p.mine=null}else{if(p.mine)p[p.mine]--;p[kind]++;p.mine=kind}render();if(openKind==='detail')renderDetail();document.querySelectorAll(`[data-vote="${kind}"][data-id="${p.id}"]`).forEach(node=>node.classList.add('bump'));return}
  if(event.target.closest('#startSelect')){selecting=true;selected.clear();render();return}if(event.target.closest('#cancelSelect')){selecting=false;selected.clear();render();return}if(event.target.closest('#chooseDate')&&!$('chooseDate').disabled){openSchedule(selected,false,event.target);return}
  const locationButton=event.target.closest('[data-location]');if(locationButton){event.stopPropagation();openLocation(locationButton.dataset.location,locationButton);return}
  const select=event.target.closest('[data-select]');if(select){event.stopPropagation();toggleSelected(select.dataset.select);return}
  if(event.target.closest('#openAdd')){addMode='search';addResult=null;showSheet('add',event.target);return}
  if(event.target.closest('[data-close]')||event.target===$('scrim')){closeSheet();return}
  const detailAction=event.target.closest('[data-detail-action]');if(detailAction){const p=places.find(x=>x.id===detailAction.dataset.detailAction);if(!p.located){openLocation(p.id,detailAction);return}scheduleIds=[p.id];selectedDay=null;changingDate=!!p.day;switchSheet('schedule');return}
  const day=event.target.closest('[data-day]');if(day){selectedDay=day.dataset.day;renderSchedule();document.querySelector(`[data-day="${selectedDay}"]`)?.focus();return}
  if(event.target.closest('#confirmSchedule')){confirmSchedule();return}
  const addTab=event.target.closest('[data-add-mode]');if(addTab){addMode=addTab.dataset.addMode;addResult=null;renderAdd();return}
  if(event.target.closest('#findPlace')){const query=$('addQuery').value.trim();addResult=addMode==='link'?{name:'京都御苑',address:'京都市上京區京都御苑 3'}:{name:query||'京都御苑',address:'京都市上京區・位置已確認'};renderAdd();return}
  if(event.target.closest('#addFound')){addPlace(addResult.name,'景點',$('foundReason').value.trim(),true);return}
  if(event.target.closest('#findLocation')){const p=places.find(item=>item.id===locationId),query=$('locationQuery').value.trim();if(!p)return;locationResult={name:p.name,address:/^https?:\/\//i.test(query)?'京都市・Google Maps 位置已確認':`${query||p.name}・京都市`};renderLocation();return}
  if(event.target.closest('#useLocation')){const p=places.find(item=>item.id===locationId);if(!p)return;p.located=true;highlightedIds=new Set([p.id]);closeSheet();showToast('已補上位置');return}
  if(event.target.closest('#toastaction')){const p=places.find(x=>x.id===toastPlaceId);$('toast').classList.remove('show');if(toastPlaceId&&p?.located){openSchedule([p.id],false,event.target)}else if(toastPlaceId){openLocation(p.id,event.target)}else window.location.href='plan.html';return}
  const row=event.target.closest('.row');if(row){if(selecting){toggleSelected(row.dataset.row)}else if(!event.target.closest('button,a')){openId=row.dataset.row;showSheet('detail',row)}return}
});
document.addEventListener('submit',event=>{if(event.target.id==='manualForm'){event.preventDefault();addPlace($('manualName').value.trim(),$('manualKind').value,$('manualReason').value.trim(),false)}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&openKind)closeSheet();if((event.key==='Enter'||event.key===' ')&&event.target.matches('.row')&&!selecting){event.preventDefault();openId=event.target.dataset.row;showSheet('detail',event.target)}});
if(demoState==='selecting'){selecting=true;selected.add('kiyomizu')}
if(demoState==='done'){places.find(p=>p.id==='kiyomizu').day='10/23';places.find(p=>p.id==='fushimi').day='10/23';highlightedIds=new Set(['kiyomizu','fushimi'])}
render();
if(demoState==='sheet'){selecting=true;selected.add('kiyomizu');selected.add('fushimi');render();scheduleIds=[...selected];selectedDay=null;changingDate=false;showSheet('schedule')}
if(demoState==='done')requestAnimationFrame(()=>showToast('已將 2 個地點排入 10/23（週五）','查看行程',null,true));
</script>
</body>
</html>
