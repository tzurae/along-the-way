<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天 — Along the Way 互動原型</title>
<style>
:root {
  --background: #f5f0e7; --foreground: #24372f; --card: #fffcf7; --primary: #1f3029;
  --primary-foreground: #fffaf2; --muted-foreground: #52645c; --accent: #d37551;
  --accent-ink: #9a4a2c; --border: color-mix(in srgb, #24372f 18%, transparent); --ring: #e09271;
  --danger: #9a422b; --warning-bg: #fff2dd;
  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  --font-display: Georgia, "Noto Serif TC", serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; min-width: 320px; min-height: 100vh; color: var(--foreground); font-family: var(--font-sans);
  background: radial-gradient(circle at 82% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28rem), linear-gradient(145deg, #f8f4ed 0%, #eee8dd 100%);
  background-attachment: fixed; overflow-x: clip;
}
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--foreground); }
button, select { font: inherit; color: inherit; }
button, summary, select, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg { display: block; flex: none; }
.app { display: grid; min-height: 100vh; }
.rail { display: none; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: color-mix(in srgb, #f8f4ed 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.triptitle { flex: 1; min-width: 0; display: flex; align-items: center; height: 46px; padding: 0 4px; font-weight: 700; font-size: 16px; }
.triptitle span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.connection-status { display: grid; place-items: center; width: 44px; height: 44px; color: var(--accent-ink); flex: none; }
.connection-status.offline { color: #8b5d46; }
main { padding: 18px 12px 112px; max-width: 900px; width: 100%; margin: 0 auto; }
.bottomnav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, #fbf8f2 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
.bottomnav :is(a,.nav-disabled) { display: grid; justify-items: center; gap: 4px; padding: 6px 0; border-radius: 14px; font-size: 13px; font-weight: 700; color: var(--foreground); text-decoration: none; }
.bottomnav a[aria-current="page"] { color: var(--accent-ink); background: color-mix(in srgb, var(--card) 80%, transparent); }
.nav-disabled { opacity: .4; cursor: default; user-select: none; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; margin: 0 2px 12px; }
.pagehead h1 { font-family: var(--font-display); font-size: 26px; line-height: 1.2; font-weight: 700; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
.pagehead .context { margin: 5px 0 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.4; }
.headnav { width: min(100%, 320px); min-width: 0; }
.notice { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; margin: 0 0 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); color: var(--accent-ink); font-size: 14px; line-height: 1.45; }
.notice strong { display: block; color: var(--foreground); }
.notice button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 8px 2px; font-weight: 700; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.notice button:disabled { opacity: .58; cursor: wait; text-decoration: none; }
.notice.offline { color: var(--foreground); background: color-mix(in srgb, var(--primary) 6%, var(--card)); border-color: var(--border); }
.notice.stale { background: var(--warning-bg); border-color: color-mix(in srgb, #9a5a28 36%, transparent); }
.notice .sub { display: block; margin-top: 2px; color: var(--muted-foreground); }
@media (max-width: 699.98px) { .notice.update-state { min-height: 89px; } }
.today-grid { display: grid; gap: 16px; grid-template-areas: "lead" "timeline"; }
.leadcard { grid-area: lead; position: relative; overflow: hidden; padding: 20px; border-radius: 20px; background: var(--primary); color: var(--primary-foreground); box-shadow: 0 14px 34px -24px rgba(31,48,41,.75); }
.leadcard::after { content: ""; position: absolute; width: 180px; height: 180px; right: -78px; top: -96px; border: 1px solid color-mix(in srgb, var(--accent) 58%, transparent); border-radius: 50%; }
.lead-top { display: flex; align-items: center; gap: 8px; color: color-mix(in srgb, var(--primary-foreground) 78%, transparent); font-size: 13px; font-weight: 700; }
.leadcard h2 { position: relative; margin: 10px 0 3px; max-width: 22ch; font-family: var(--font-display); font-size: 26px; line-height: 1.25; letter-spacing: -.01em; }
.leadcard .nexttime { display: flex; align-items: center; gap: 6px; margin: 0; color: color-mix(in srgb, var(--primary-foreground) 78%, transparent); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.route { display: grid; grid-template-columns: 19px minmax(0,1fr); gap: 8px 10px; margin: 18px 0; font-size: 14px; line-height: 1.45; }
.route svg { margin-top: 1px; color: var(--accent); }
.route span { overflow-wrap: anywhere; }
.primarybtn { min-height: 48px; display: inline-flex; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--accent); color: #fffaf2; font-weight: 700; font-size: 15px; line-height: 1.2; white-space: nowrap; text-decoration: none; box-shadow: 0 9px 24px -14px rgba(0,0,0,.65); transition: transform .2s var(--ease-out); }
.primarybtn:active { transform: scale(.97); }
.primarybtn.light { background: var(--card); color: var(--primary); box-shadow: none; }
.navnote { display: block; margin: 9px 3px 0; color: color-mix(in srgb, var(--primary-foreground) 72%, transparent); font-size: 12px; line-height: 1.45; }
.before-summary { margin: 16px 0 18px; padding: 12px 0; border-block: 1px solid color-mix(in srgb, var(--primary-foreground) 17%, transparent); font-size: 14px; }
.before-summary strong { display: block; margin-bottom: 3px; color: var(--primary-foreground); }
.before-summary span { color: color-mix(in srgb, var(--primary-foreground) 76%, transparent); }
.dayrow { display: grid; grid-template-columns: 70px minmax(0,1fr) 70px; gap: 8px; align-items: center; }
.dayarrow { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 44px; padding: 0 6px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; text-decoration: none; }
.dayarrow[aria-disabled="true"] { opacity: .38; pointer-events: none; }
.selectwrap { position: relative; min-width: 0; }
.selectwrap > svg { position: absolute; z-index: 1; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted-foreground); }
.dayselect { appearance: none; -webkit-appearance: none; width: 100%; height: 44px; min-width: 0; border: 1px solid var(--border); border-radius: 14px; padding: 0 38px 0 12px; background: var(--card); font-weight: 700; line-height: 1.2; text-overflow: ellipsis; }
.zone { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 2px 0; font-size: 12px; color: var(--muted-foreground); }
.zone > span { display: inline-flex; align-items: center; gap: 4px; }
.sync { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-weight: 600; }
.timeline { grid-area: timeline; min-width: 0; padding: 0 2px; }
.sectionhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 2px 12px; }
.sectionhead h2 { margin: 0; font-size: 19px; line-height: 1.3; }
.sectionhead span { color: var(--muted-foreground); font-size: 13px; font-variant-numeric: tabular-nums; }
.past { margin-bottom: 0; border-block: 1px solid var(--border); }
.past summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 48px; font-size: 14px; font-weight: 700; color: var(--muted-foreground); }
.past summary::-webkit-details-marker { display: none; }
.chev { transition: transform .25s var(--ease-out); }
details[open] > summary .chev { transform: rotate(90deg); }
.pastlist { padding-bottom: 4px; }
.timeline-list { list-style: none; padding: 0; margin: 0; }
.stop { position: relative; display: grid; grid-template-columns: 56px 12px 16px minmax(0,1fr); min-width: 0; align-items: stretch; }
.stop::before { content: ""; position: absolute; left: 61.5px; top: 0; bottom: 0; width: 1px; background: var(--border); }
.stop:last-child::before { bottom: 50%; }
.time { grid-column: 1; align-self: center; padding-right: 12px; text-align: right; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.track { grid-column: 2; position: relative; z-index: 1; }
.track::after { content: ""; position: absolute; left: 0; top: calc(50% - 5.5px); width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--background); background: color-mix(in srgb, var(--foreground) 34%, var(--card)); }
.stop.current .track::after, .stop.next .track::after { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.stopcontent { grid-column: 4; min-width: 0; display: flex; align-items: center; gap: 8px; }
.stopbtn { flex: 1; min-width: 0; min-height: inherit; border: 0; background: transparent; text-align: left; padding: 8px 2px; border-radius: 8px; }
.stopbtn:hover { background: color-mix(in srgb, var(--card) 44%, transparent); }
.stop-title { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; min-width: 0; }
.stop-title strong { font-size: 16px; line-height: 1.35; }
.stop-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px; margin-top: 3px; color: var(--muted-foreground); font-size: 13px; line-height: 1.4; }
.stop.past { min-height: 56px; }
.stop.current { min-height: 96px; }
.stop.next { min-height: 88px; }
.stop.later, .stop.unscheduled { min-height: 56px; }
.past + .timeline-list > .stop:first-child { margin-top: 16px; }
.stop.current + .stop.next { margin-top: 8px; }
.stop.next + .stop.later, .stop.next + .stop.unscheduled { margin-top: 16px; }
.remove-draft { flex: none; min-height: 36px; padding: 0 8px; border: 0; background: transparent; color: var(--danger); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.openhint { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: 1; padding: 5px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-ink); }
.chip.status { background: color-mix(in srgb, var(--primary) 8%, transparent); color: var(--foreground); }
.chip svg { width: 14px; height: 14px; }
.changed-note { color: var(--accent-ink); font-weight: 700; }
.empty { padding: 28px 20px; border: 1px dashed color-mix(in srgb, var(--foreground) 28%, transparent); border-radius: 18px; background: color-mix(in srgb, var(--card) 54%, transparent); text-align: center; }
.empty > svg { margin: 0 auto 10px; color: var(--accent-ink); }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 22px; }
.empty p { margin: 8px auto 18px; max-width: 35ch; color: var(--muted-foreground); font-size: 14px; line-height: 1.55; }
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(31,48,41,.32); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; height: min(82dvh, 720px); display: flex; flex-direction: column; background: var(--card); border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px -16px rgba(31,48,41,.45); transform: translateY(104%); transition: transform .45s var(--ease-out); }
.sheet.show { transform: translateY(0); }
.grab { width: 40px; height: 5px; border-radius: 999px; background: color-mix(in srgb, #24372f 18%, transparent); margin: 8px auto 0; flex: none; }
.sheethead { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px 12px; flex: none; }
.sheethead h2 { font-family: var(--font-display); font-size: 24px; line-height: 1.25; margin: 0 0 7px; }
.sheethead p { margin: 0; font-size: 13px; color: var(--muted-foreground); line-height: 1.45; }
.iconbtn { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); padding: 0; }
.sheetbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 20px; background: linear-gradient(var(--card) 30%, transparent) top / 100% 28px no-repeat local, linear-gradient(transparent, var(--card) 70%) bottom / 100% 28px no-repeat local, radial-gradient(farthest-side at 50% 0, rgba(31,48,41,.16), transparent) top / 100% 10px no-repeat scroll, radial-gradient(farthest-side at 50% 100%, rgba(31,48,41,.16), transparent) bottom / 100% 10px no-repeat scroll, var(--card); }
.sec { padding: 16px 0; }
.sec + .sec { border-top: 1px solid var(--border); }
.sec h3 { font-size: 13px; font-weight: 700; color: var(--muted-foreground); margin: 0 0 10px; }
.facts { display: grid; gap: 12px; margin: 0; }
.facts div { display: grid; gap: 3px; }
.facts dt { font-size: 13px; color: var(--muted-foreground); }
.facts dd { margin: 0; font-size: 15px; line-height: 1.55; overflow-wrap: anywhere; }
.plan-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.plan-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
.plan-row:first-child { border-top: 0; }
.plan-row strong, .plan-row span { display: block; }
.plan-row span { margin-top: 3px; color: var(--muted-foreground); font-size: 13px; }
.plan-row .plan-status { display: flex; align-items: center; gap: 5px; }
.schedulebtn { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-weight: 700; font-size: 13px; }
.timeform { display: grid; gap: 14px; }
.timefields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
.timefield { display: grid; gap: 6px; color: var(--muted-foreground); font-size: 13px; font-weight: 700; }
.formselect { appearance: none; -webkit-appearance: none; width: 100%; height: 44px; min-width: 0; padding: 0 38px 0 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--foreground); font-weight: 700; }
.formerror { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--warning-bg); color: #7a421d; font-size: 13px; line-height: 1.5; }
.formactions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.formactions .primarybtn { min-height: 42px; }
.secondarybtn { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--foreground); font-size: 14px; font-weight: 700; white-space: nowrap; }
.sheetbody .notes { margin: 0; padding-left: 1.2em; font-size: 15px; line-height: 1.65; }
.maplink { display: inline-flex; flex-wrap: nowrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.3; white-space: nowrap; color: var(--foreground); text-underline-offset: 3px; }
.sheetfoot { flex: none; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--card); }
.sheetfoot .primarybtn { width: 100%; }
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); font-weight: 700; font-size: 14px; white-space: nowrap; box-shadow: 0 14px 34px -12px rgba(31,48,41,.6); transform: translate(-50%, 28px) scale(.96); opacity: 0; pointer-events: none; transition: transform .45s var(--ease-out), opacity .3s var(--ease-out); }
.toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.lead-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.replan-btn { position: relative; }
.past-label { display: flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 2px; border-block: 1px solid var(--border); color: var(--muted-foreground); font-size: 13px; font-weight: 700; }
.past-label span { margin-left: auto; font-variant-numeric: tabular-nums; }
.stop.past, .stop.past-unconfirmed { min-height: 78px; }
.stop.past { color: var(--muted-foreground); }
.stop.past .stop-title strong { font-weight: 650; }
.stop.past .track::after { left: -2px; top: calc(50% - 7.5px); width: 15px; height: 15px; border: 0; background: var(--primary); }
.stop.past .track svg { position: absolute; z-index: 2; left: 0; top: calc(50% - 5.5px); color: var(--primary-foreground); }
.stop.past.presence-skipped .track::after { left: 0; top: calc(50% - 5.5px); width: 11px; height: 11px; border: 2px solid var(--background); background: color-mix(in srgb, var(--foreground) 42%, var(--card)); }
.stopcontent { flex-wrap: wrap; padding-block: 5px; }
.corrections, .choice-group { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); width: 100%; gap: 0; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.corrections { padding-bottom: 0; }
.corrections button, .choice-group button { min-width: 0; min-height: 48px; display: grid; grid-template-columns: 18px minmax(0,auto) 16px; align-items: center; justify-content: center; gap: 7px; padding: 6px 12px; border: 0; border-radius: 0; background: var(--card); color: var(--foreground); font-size: 14px; font-weight: 700; line-height: 1.25; }
.corrections button + button, .upcoming-choices button + button, .past-choices button:nth-child(2) { border-left: 1px solid var(--border); }
.corrections button[aria-pressed="true"], .choice-group button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--primary-foreground) 42%, transparent); }
.segment-choice .segment-label, .review-row .segment-choice .segment-label { display: block; min-width: 0; margin: 0; color: inherit; font-size: 14px; line-height: 1.25; }
.segment-choice .selection-mark, .review-row .segment-choice .selection-mark { display: grid; place-items: center; width: 16px; height: 16px; margin: 0; color: inherit; opacity: 0; }
.segment-choice[aria-pressed="true"] .selection-mark { opacity: 1; }
.stop.past .stopcontent, .stop.past-unconfirmed .stopcontent { flex-wrap: nowrap; }
.stop.past .stopbtn, .stop.past-unconfirmed .stopbtn { min-width: 0; }
.corrections { flex: none; width: 89px; border: 0; border-radius: 0; background: transparent; }
.corrections button, .corrections button + button, .corrections button[aria-pressed="true"] { width: 44px; height: 44px; min-height: 44px; grid-template-columns: 18px; gap: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: #a4aba6; }
.corrections button[aria-pressed="true"][data-value="ended"] { color: #cc7850; }
.corrections button[aria-pressed="true"][data-value="skipped"] { color: #4b5350; }
.corrections button[aria-pressed="true"] svg { stroke-width: 3; }
.replan-result { grid-template-columns: 20px minmax(0,1fr) auto; }
.result-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 6px 10px; }
.result-actions a, .result-actions button { display: inline-flex; align-items: center; gap: 5px; color: var(--accent-ink); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.result-actions button { padding: 6px 2px; }
.review-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.review-row { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--border); }
.review-row:first-child { border-top: 0; }
.review-row strong, .review-row span { display: block; }
.review-row span { margin-top: 3px; color: var(--muted-foreground); font-size: 13px; line-height: 1.45; }
.review-row .review-status { display: flex; align-items: center; gap: 5px; }
.past-choices button:last-child { grid-column: 1 / -1; border-top: 1px solid var(--border); }
.review-group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.review-group-head h3 { margin: 0; }
.review-group-head button { flex: none; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--foreground); font-size: 12px; font-weight: 700; }
.confirm-count { margin: 0 0 5px; color: var(--accent-ink); font-size: 13px; font-weight: 700; }
.primarybtn:disabled { opacity: .48; cursor: not-allowed; }
.replan-summary, .unknown-time, .booking-warning { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; align-items: start; margin-bottom: 10px; padding: 13px 14px; border-radius: 14px; font-size: 13px; line-height: 1.45; }
.replan-summary { background: var(--primary); color: var(--primary-foreground); }
.replan-summary svg { color: var(--accent); }
.unknown-time { border: 1px solid color-mix(in srgb, #8a531f 34%, transparent); background: var(--warning-bg); color: #71431b; }
.booking-warning { border: 1px solid color-mix(in srgb, var(--danger) 34%, transparent); background: color-mix(in srgb, var(--danger) 8%, var(--card)); color: var(--danger); }
.replan-summary strong, .unknown-time strong, .booking-warning strong { display: block; font-size: 14px; }
.replan-summary span, .unknown-time span, .booking-warning span { display: block; margin-top: 2px; }

  const notGoing = plan.dropped.length ? `<div class="not-going"><div class="not-going-head">${svg(I.calendarX,18)}<div><h3>今天不去</h3><p>套用後會移到行程的「待安排」，不指定新的日期。</p></div></div>${plan.dropped.map(item => `<div class="unfit-place"><strong>${esc(item.title)}</strong><span>你在確認時選了今天不去。</span></div>`).join("")}</div>` : "";
  const unfit = plan.rejected.length ? `<div class="unfit"><div class="unfit-head">${svg(I.calendarOff,18)}<div><h3>今天排不下</h3><p>套用後會移到行程的「待安排」，不指定新的日期。</p></div></div>${plan.rejected.map(({item,reason}) => `<div class="unfit-place"><strong>${esc(item.title)}</strong><span>原因：${esc(reason)}</span></div>`).join("")}</div>` : "";
  return `<div class="grab" aria-hidden="true"></div><header class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">比較重新安排</h2><p>固定事項不會移動；你選擇今天不去的地點會移到待安排。</p></div><button class="iconbtn" type="button" data-close aria-label="關閉">${svg(I.close,18)}</button></header><div class="sheetbody">${summary}<aside class="unknown-time">${svg(I.alert,19)}<div><strong>部分路段的交通時間查不到</strong><span>重新安排會從${esc(plan.origin?.title || "目前位置")}開始；部分地點缺少路線資料，因此不顯示推測的交通分鐘數，仍保留 15 分鐘移動緩衝。</span></div></aside>${warnings}${endedDisclosure(plan.ended)}<div class="replan-compare"><section><div class="compare-head"><h3>${svg(I.listOrdered,18)}目前</h3><span>尚未變更</span></div><ol class="compare-list">${plan.currentRows.map(item => currentCompareRow(item,plan)).join("")}</ol></section><section><div class="compare-head"><h3>${svg(I.sparkles,18)}建議</h3><span>套用前預覽</span></div><ol class="compare-list">${plan.scheduled.map(suggestedCompareRow).join("")}</ol>${notGoing}${unfit}</section></div></div><footer class="sheetfoot split-foot"><button class="secondarybtn" type="button" data-replan-back>${svg(I.left,17)}返回確認</button><button class="primarybtn" type="button" data-apply-replan>${svg(I.circleCheck,17)}${optimal ? "保留目前安排" : "套用重新安排"}</button></footer>`;
}
function openReplan(focus) {
  replanStep = 1;
  latestReplanPlan = null;
  replanStatusSnapshot = Object.fromEntries(itemStatuses);
  openSheet(replanStepOne(), focus);
}
function applyReplan() {
  const plan = latestReplanPlan || computeReplanPlan();
  if (!plan.changed && !plan.rejected.length) {
    clearReplanTransaction();
    replanResult = null;
    closeSheet();
    setTimeout(() => showToast("目前安排沒有變更"), 460);
    return;
  }
  undoSnapshot = JSON.parse(JSON.stringify(placeStore));
  const rejectedIds = new Set(plan.rejected.map(({item}) => item.id));
  const droppedIds = new Set(plan.dropped.map(item => item.id));
  const unplacedIds = new Set([...rejectedIds,...droppedIds]);
  placeStore.places = placeStore.places.map(place => {
    if (unplacedIds.has(place.id)) return {...place,dayDate:null,start:null,unplacedFromDate:selected,confirmed:true};
    const scheduled = plan.scheduledById.get(place.id);
    if (scheduled && place.dayDate === selected) return {...place,start:minuteLabel(scheduled.startM)};
    return place;
  });
  [...plan.accepted,...plan.rejected.map(({item}) => item)].forEach(item => itemStatuses.delete(item.id));
  persistItemStatuses();
  persistPlaces();
  const cannotFitNames = plan.rejected.map(({item}) => item.title);
  const droppedNames = plan.dropped.map(item => item.title);
  const names = [...cannotFitNames,...droppedNames];
  if (names.length) {
    replanResult = {names,droppedNames};
    persistReplanTransaction({version:1,before:undoSnapshot,after:JSON.parse(JSON.stringify(placeStore)),beforeStatuses:replanStatusSnapshot || {},afterStatuses:Object.fromEntries(itemStatuses),names,droppedNames,bumpedIds:[...unplacedIds]});
  } else {
    clearReplanTransaction();
    replanResult = null;
  }
  closeSheet();
  render();
  setTimeout(() => showToast(droppedNames.length ? "今天不去的地點已移到待安排" : names.length ? "已重新安排，排不下的地點已移到待安排" : "已套用重新安排"), 460);
}
function refreshSharedState() {
  placeStore = readPlaceStore();
  itemStatuses = readItemStatuses();
  ensurePastStatusDefaults();
  const transaction = readReplanTransaction();
  replanResult = transaction ? {names:transaction.names,droppedNames:transaction.droppedNames || []} : null;
  undoSnapshot = transaction ? transaction.before : null;
  render();
}
function undoReplan() {
  let transaction = null;
  try { transaction = JSON.parse(localStorage.getItem(REPLAN_STORAGE_KEY) || "null"); } catch {}
  const persistedStore = readPlaceStore();
  const persistedStatuses = readItemStatuses();
  const statusesMatch = !transaction?.afterStatuses
    || JSON.stringify(transaction.afterStatuses) === JSON.stringify(Object.fromEntries(persistedStatuses));
  const currentMatches = transaction?.version === 1
    && transaction.before?.version === 1
    && transaction.after?.version === 1
    && JSON.stringify(transaction.after) === JSON.stringify(persistedStore)
    && statusesMatch;
  if (!currentMatches) {
    placeStore = persistedStore;
    itemStatuses = persistedStatuses;
    clearReplanTransaction();
    undoSnapshot = null;
    replanResult = null;
    render();
    showToast("行程已有其他變更，無法復原");
    return;
  }
  placeStore = JSON.parse(JSON.stringify(transaction.before));
  if (transaction.beforeStatuses) itemStatuses = new Map(Object.entries(transaction.beforeStatuses));
  persistPlaces();
  persistItemStatuses();
  clearReplanTransaction();
  undoSnapshot = null;
  replanResult = null;
  render();
  showToast("已復原重新安排");
}
function applyPendingUpdate() {
  if (!pendingUpdate) return;
  const y = scrollY;
  const main = document.getElementById("main");
  const oldHeight = document.documentElement.scrollHeight;
  const oldPadding = parseFloat(getComputedStyle(main).paddingBottom);
  const hotel = data["2026-10-21"].items.find(item => item.id === "granvia-in");
  hotel.start = "13:45";
  hotel.updateNote = "提早抵達可先寄放行李";
  if (!hotel.notes.includes("提早抵達可先寄放行李")) hotel.notes.push("提早抵達可先寄放行李");
  pendingUpdate = false;
  updateApplied = true;
  const sheet = document.getElementById("sheet");
  sheet.classList.remove("show");
  document.getElementById("scrim").classList.remove("show");
  render();
  requestAnimationFrame(() => { const delta=Math.max(0,oldHeight-document.documentElement.scrollHeight); if(delta) main.style.paddingBottom=`${oldPadding+delta}px`; scrollTo(0, y); showToast("已套用示範更新，原本位置已保留"); });
  setTimeout(() => { sheet.hidden = true; }, 450);
}
function openSheet(content, focus) {
  lastFocus = focus; const sheet = document.getElementById("sheet");
  sheet.innerHTML = content; sheet.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add("show"); document.getElementById("scrim").classList.add("show"); document.getElementById("sheettitle")?.focus({preventScroll:true}); });
}
function closeSheet() {
  const sheet = document.getElementById("sheet"); sheet.classList.remove("show"); document.getElementById("scrim").classList.remove("show");
  setTimeout(() => sheet.hidden = true, 450); lastFocus?.focus({preventScroll:true});
}
function showToast(text) { const t=document.getElementById("toast"); t.innerHTML=`${svg(I.check,17,3)}${esc(text)}`; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),2600); }
function startReconnect() {
  if (connecting) return;
  connecting = true;
  render();
  setTimeout(() => {
    if (offline) {
      offline = null;
      connecting = false;
      reconnectSucceeded = true;
      render();
      showToast("已重新連線，行程已同步");
      return;
    }
    if (loadFailed) {
      retryAttempts += 1;
      connecting = false;
      if (retryAttempts === 1) {
        render();
        showToast("仍無法連線，行程已保留");
        return;
      }
      loadFailed = false;
      reconnectSucceeded = true;
      render();
      showToast("已重新連線，行程已同步");
    }
  }, 1000);
}
ensurePastStatusDefaults();
render();
document.addEventListener("change", e => { if (e.target.id === "dayselect") location.href = queryFor(e.target.value); });
document.addEventListener("submit", e => {
  const form=e.target.closest("#place-time-form");
  if(!form) return;
  e.preventDefault();
  const place=storedPlace(form.dataset.placeId);
  if(!place || !place.dayDate) return;
  const start=form.elements.start.value;
  const duration=Number(form.elements.duration.value);
  const item=placeItem(place);
  if(!start){
    document.getElementById("sheet").innerHTML=detail(item,{start,duration,error:"請先選擇開始時間。"});
    document.getElementById("time-error")?.focus();
    return;
  }
  const startMinutes=minutes(start);
  const endMinutes=startMinutes+duration;
  const collision=data[place.dayDate].items.find(candidate=>candidate.fixed && startMinutes<minutes(candidate.end) && minutes(candidate.start)<endMinutes);
  if(collision){
    document.getElementById("sheet").innerHTML=detail(item,{start,duration,error:`這段時間與固定事項「${collision.title}」（${collision.start}–${collision.end}）重疊，請改選時間。`});
    document.getElementById("time-error")?.focus();
    return;
  }
  if(place.start===start && Number(place.duration)===duration){closeSheet();return;}
  Object.assign(place,{start,duration});
  persistPlaces();
  closeSheet();
  render();
  setTimeout(()=>showToast(`已將 ${place.name} 排在 ${start}`),460);
});
document.addEventListener("click", e => {
  const itemBtn=e.target.closest("[data-item]"); if(itemBtn){const item=dayItems(selected).find(candidate=>candidate.id===itemBtn.dataset.item);if(item)openSheet(detail(item),itemBtn);return;}
  if(e.target.closest("[data-update]")){openSheet(updateDetail(),e.target.closest("[data-update]"));return;}
  const clear=e.target.closest("[data-clear-time]"); if(clear){const place=storedPlace(clear.dataset.clearTime);if(place?.start){place.start=null;persistPlaces();closeSheet();render();setTimeout(()=>showToast("已清除時間，地點回到這天的待排"),460);}return;}
  if(e.target.closest("[data-close]")||e.target===document.getElementById("scrim")){closeSheet();return;}
  if(e.target.closest("[data-plan-done]")){closeSheet();render();return;}
  const plan=e.target.closest("[data-plan]"); if(plan){e.preventDefault();openSheet(planDetail(plan.dataset.plan),plan);return;}
  const schedule=e.target.closest("[data-schedule]"); if(schedule){const place=storedPlace(schedule.dataset.schedule);if(place){Object.assign(place,{confirmed:true,dayDate:planningDate,start:null,unplacedFromDate:null});persistPlaces();document.getElementById("sheet").innerHTML=planDetail(planningDate);document.getElementById("sheettitle")?.focus({preventScroll:true});showToast(`已將 ${place.name} 排入這天`);}return;}
  const presence=e.target.closest("[data-presence]"); if(presence){const current=itemStatuses.get(presence.dataset.presence);if(current===presence.dataset.value)itemStatuses.delete(presence.dataset.presence);else itemStatuses.set(presence.dataset.presence,presence.dataset.value);persistItemStatuses();render();return;}
  const replan=e.target.closest("[data-replan]"); if(replan){openReplan(replan);return;}
  const allEnded=e.target.closest("[data-all-ended]"); if(allEnded){unconfirmedReplanPastItems().forEach(item=>itemStatuses.set(item.id,"ended"));persistItemStatuses();render();document.getElementById("sheet").innerHTML=replanStepOne();document.querySelector("[data-all-ended]")?.focus({preventScroll:true});return;}
  const choice=e.target.closest("[data-replan-choice]"); if(choice){itemStatuses.set(choice.dataset.replanChoice,choice.dataset.value);persistItemStatuses();render();document.getElementById("sheet").innerHTML=replanStepOne();document.querySelector(`[data-replan-choice="${CSS.escape(choice.dataset.replanChoice)}"][data-value="${CSS.escape(choice.dataset.value)}"]`)?.focus({preventScroll:true});return;}
  if(e.target.closest("[data-replan-next]")){if(unconfirmedReplanPastItems().length)return;replanStep=2;document.getElementById("sheet").innerHTML=replanStepTwo();document.getElementById("sheettitle")?.focus({preventScroll:true});return;}
  if(e.target.closest("[data-replan-back]")){replanStep=1;document.getElementById("sheet").innerHTML=replanStepOne();document.getElementById("sheettitle")?.focus({preventScroll:true});return;}
  if(e.target.closest("[data-apply-replan]")){applyReplan();return;}
  if(e.target.closest("[data-undo-bump]")){undoReplan();return;}
  if(e.target.closest("#retry")){startReconnect();return;}
  if(e.target.closest("#applyUpdate")){applyPendingUpdate();return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("sheet").hidden)closeSheet();});
window.addEventListener("pageshow", e => { if (e.persisted) refreshSharedState(); });
window.addEventListener("storage", e => {
  if (e.key === PLACE_STORAGE_KEY || e.key === REPLAN_STORAGE_KEY || e.key === STATUS_STORAGE_KEY) refreshSharedState();
});
</script>
