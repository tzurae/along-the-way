<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 建議 — 互動原型</title>
<style>
:root {
  --background: #f5f0e7; --foreground: #24372f; --card: #fffcf7; --primary: #1f3029;
  --primary-foreground: #fffaf2; --muted-foreground: #52645c; --accent: #d37551;
  --accent-ink: #9a4a2c; --border: color-mix(in srgb, #24372f 18%, transparent); --ring: #e09271;
  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  --font-display: Georgia, "Noto Serif TC", serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-width: 320px; min-height: 100vh; color: var(--foreground); font-family: var(--font-sans);
  background: radial-gradient(circle at 82% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28rem), linear-gradient(145deg, #f8f4ed 0%, #eee8dd 100%);
  background-attachment: fixed; overflow-x: clip;
}
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--foreground); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; min-height: 100vh; }
.rail { display: none; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: color-mix(in srgb, #f8f4ed 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.switcher { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 46px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--card); font-weight: 700; font-size: 16px; }
.switcher span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; margin: 0 6px; }
main { padding: 16px 10px 150px; max-width: 1180px; width: 100%; }
.segments { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 18px; background: color-mix(in srgb, var(--card) 60%, transparent); border: 1px solid var(--border); margin-bottom: 22px; }
.segments > a { display: grid; place-items: center; height: 46px; border-radius: 14px; font-weight: 700; font-size: 16px; color: var(--muted-foreground); text-decoration: none; }
.segments > a[aria-selected="true"] { background: var(--card); color: var(--accent-ink); box-shadow: 0 2px 8px -4px rgba(31,48,41,.25); }
.bottomnav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, #fbf8f2 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
.bottomnav a { display: grid; justify-items: center; gap: 4px; padding: 6px 0; border-radius: 14px; font-size: 13px; font-weight: 700; color: var(--foreground); text-decoration: none; }
.bottomnav a[aria-current="page"] { color: var(--accent-ink); background: color-mix(in srgb, var(--card) 80%, transparent); }

/* ---------- page header ---------- */
.pagehead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px 2px; min-height: 44px; }
.pagehead h1 { font-family: var(--font-display); font-size: 25px; line-height: 1.2; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.headside { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.ghost { height: 34px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-weight: 600; font-size: 14px; color: var(--foreground); transition: background .2s var(--ease-out); }
.ghost:hover { background: #fff; }
.iconghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px 0 12px; }
.iconaction { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.headside .ghost { min-height: 44px; height: 44px; padding: 0 15px; gap: 7px; font-size: 14px; font-weight: 700; }
.headprimary { min-height: 44px; height: 44px; padding: 0 18px; gap: 7px; font-size: 15px; font-weight: 700; box-shadow: none; }
.loader-icon { animation: spin .8s linear infinite; }
.subhead { margin: 0 4px 14px; min-height: 20px; font-size: 14px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.banner { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-size: 14px; line-height: 1.5; color: var(--accent-ink); }
.spinner { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.fieldlabel { display: block; font-size: 15px; font-weight: 700; margin: 0 0 8px; }
textarea.brief { display: block; width: 100%; resize: vertical; min-height: 140px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); background: #fff; color: var(--foreground); font: 15px/1.6 var(--font-sans); }
textarea.brief:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
textarea.brief.invalid { border-color: #b55737; }
.unclear { display: grid; grid-template-columns: 18px 1fr; gap: 10px; margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, #b55737 8%, var(--card)); border: 1px solid color-mix(in srgb, #b55737 30%, transparent); color: #8f4228; }
.unclear svg { margin-top: 2px; }
.unclear div { display: grid; gap: 4px; font-size: 14px; line-height: 1.55; }
.unclear strong { font-size: 15px; }
.unclear span { color: var(--foreground); }
.failbox { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; margin: 0 0 12px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, #b55737 8%, var(--card)); border: 1px solid color-mix(in srgb, #b55737 30%, transparent); color: #8f4228; }
.rejected { margin-top: 16px; padding: 0 4px; }
.rejected summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 0; font-size: 14px; font-weight: 600; color: var(--muted-foreground); }
.rejected summary::-webkit-details-marker { display: none; }
.rejected summary svg { transition: transform .25s var(--ease-out); }
.rejected[open] summary svg { transform: rotate(90deg); }
.rejectedhint { margin: 4px 0 10px; font-size: 13px; line-height: 1.5; color: var(--muted-foreground); }
.rejected ul { margin: 0; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: 14px; background: var(--card); }
.rejected li { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.rejected li + li { border-top: 1px solid var(--border); }
.rname { font-size: 15px; font-weight: 600; }
.failbox > svg { align-self: start; margin-top: 2px; }
.failtext { display: grid; gap: 3px; font-size: 14px; line-height: 1.55; min-width: 0; }
.failtext strong { font-size: 15px; }
.failtext span { color: var(--foreground); }
.firstrun .failbox { margin-bottom: 4px; }
.hint { display: flex; gap: 6px; margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted-foreground); }
.hint svg { flex: none; margin-top: 2px; }
.primarybtn.small { height: 42px; padding: 0 20px; font-size: 15px; box-shadow: none; }
.askcard { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; padding: 14px 14px 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
.askicon { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--accent-ink); }
.asktext { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: 13px; line-height: 1.45; color: var(--muted-foreground); }
.asktext strong { font-size: 15px; color: var(--foreground); }
.sheetsub { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted-foreground); }
.qitem { display: grid; gap: 12px; border: 0; margin: 0; padding: 0; min-width: 0; }
.qitem legend { padding: 0; margin-bottom: 12px; }
.qtext { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.55; }
.qtext.small { font-size: 13px; font-weight: 600; color: var(--muted-foreground); }
.optgroup { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--card); }
.opt { display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start; min-height: 56px; padding: 14px 16px; cursor: pointer; transition: background-color .2s var(--ease-out); }
.opt + .opt { border-top: 1px solid var(--border); }
.opt:hover { background: color-mix(in srgb, var(--primary) 3%, var(--card)); }
.opt.on { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
.opt input { appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border-radius: 50%; border: 1.5px solid color-mix(in srgb, #24372f 40%, transparent); background: #fff; display: grid; place-items: center; transition: border-color .2s var(--ease-out); }
.opt input::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .25s var(--ease-out); }
.opt input:checked { border-color: var(--accent); }
.opt input:checked::after { transform: scale(1); }
.optbody { display: grid; gap: 3px; min-width: 0; }
.optlabel { font-size: 16px; font-weight: 600; line-height: 1.45; }
.opteffect { font-size: 14px; line-height: 1.5; color: var(--muted-foreground); }
.customwrap { display: grid; gap: 6px; margin-top: 8px; }
.customlabel { font-size: 13px; font-weight: 700; color: var(--muted-foreground); }
textarea.qanswer { width: 100%; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff; color: var(--foreground); font: 15px/1.55 var(--font-sans); }
.qerror { font-size: 13px; font-weight: 600; color: #b55737; }
.answered { display: grid; gap: 12px; }
.answered li { display: grid; gap: 2px; font-size: 14px; line-height: 1.5; }
.unknownans { color: var(--muted-foreground); }
.gateactions { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
/* Higher specificity than `.firstrun .primarybtn`, whose 18px top margin pushed the button below the link. */
.firstrun .gateactions .primarybtn { margin-top: 0; }
@media (max-width: 599.98px) {
  .gateactions { flex-direction: column; align-items: stretch; gap: 6px; }
  .firstrun .gateactions .primarybtn { justify-self: stretch; width: 100%; }
  .gateactions .linkbtn { align-self: center; padding: 10px 12px; }
}
.linkbtn { border: 0; background: none; padding: 8px 0; font-size: 14px; font-weight: 600; color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }
.firstrun { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 24px 20px; display: grid; gap: 4px; }
.firstrun h2 { font-family: var(--font-display); font-size: 24px; line-height: 1.3; margin: 0; text-wrap: balance; }
.firstrun .lede { margin: 6px 0 18px; font-size: 15px; line-height: 1.65; color: var(--muted-foreground); max-width: 46ch; }
.firstrun .primarybtn { justify-self: start; margin-top: 18px; box-shadow: none; }
/* Questions read and compare best at a prose measure, not stretched across a 1100px column. */
.firstrun > div:has(> .qitem), .firstrun .brief, .firstrun .hint { max-width: 760px; }
.waithead { display: flex; gap: 14px; align-items: flex-start; }
.waithead .lede { margin: 6px 0 0; }
.spinner.big { width: 24px; height: 24px; border-width: 3px; margin-top: 6px; }
.asked { margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--primary) 5%, var(--card)); }
.askedlabel { display: block; font-size: 13px; font-weight: 700; color: var(--muted-foreground); margin-bottom: 4px; }
.asked p { margin: 0; font-size: 14px; line-height: 1.6; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.ghostrows { margin-top: 18px; display: grid; }
.ghostrow { display: grid; gap: 10px; padding: 18px 0; }
.ghostrow + .ghostrow { border-top: 1px solid var(--border); }
.ghostrow i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--primary) 7%, transparent) 0%, color-mix(in srgb, var(--primary) 13%, transparent) 50%, color-mix(in srgb, var(--primary) 7%, transparent) 100%); background-size: 200% 100%; animation: shimmer 1.6s ease-in-out infinite; }
.ghostrow i:first-child { height: 16px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.list.revealing .row { animation: rise .6s var(--ease-out) both; }
.list.revealing .row:nth-child(2) { animation-delay: .06s; } .list.revealing .row:nth-child(3) { animation-delay: .12s; }
.list.revealing .row:nth-child(4) { animation-delay: .18s; } .list.revealing .row:nth-child(5) { animation-delay: .24s; } .list.revealing .row:nth-child(6) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- list ---------- */
.list { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 0; overflow: hidden; }
.row { position: relative; display: grid; grid-template-columns: 82px minmax(0,1fr); gap: 14px; padding: 16px; transition: background-color .55s var(--ease-out); cursor: pointer; }
.row + .row { border-top: 1px solid var(--border); }
.row:hover { background: color-mix(in srgb,var(--primary) 2.5%,var(--card)); }
.row.open { background: color-mix(in srgb,var(--accent) 9%,var(--card)); }
/* Scheduled suggestions keep their content strength while showing itinerary status. */
.row.scheduled { background: color-mix(in srgb, var(--primary) 10%, var(--card)); }
.row.scheduled.just-scheduled { animation: settlesch 1.2s var(--ease-out); }
@keyframes settlesch { 0% { background-color: color-mix(in srgb, var(--accent) 24%, var(--card)); } 100% { background-color: color-mix(in srgb, var(--primary) 10%, var(--card)); } }
.row.scheduled.open { background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
.row.selecting { cursor: default; }
.row.selecting:hover { background: var(--card); }
.row.selecting.is-selectable { cursor: pointer; }
.row.selecting.is-selectable:hover { background: color-mix(in srgb,var(--primary) 2.5%,var(--card)); }
.row.selecting.is-selected { background: color-mix(in srgb,var(--accent) 8%,var(--card)); }
.thumb { width: 82px; height: 82px; align-self: start; overflow: hidden; border-radius: 14px; background: color-mix(in srgb,var(--primary) 6%,var(--card)); border: 1px solid var(--border); }
.thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.nophoto { width: 100%; height: 100%; display: grid; place-items: center; align-content: center; gap: 5px; padding: 8px; color: var(--muted-foreground); font-size: 10px; line-height: 1.25; text-align: center; }
.rowcontent { min-width: 0; }
.titleline { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 6px; }
.titleline h2 { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 17px; line-height: 1.4; font-weight: 700; margin: 0; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 1; padding: 4px 8px 4px 6px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-ink); }
.scheduledtag { padding: 4px 10px 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--primary) 14%, transparent); font-size: 13px; line-height: 1.2; font-weight: 700; color: var(--primary); display: inline-flex; align-items: center; gap: 4px; }
.spacer { flex: 1; }
.desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; max-width: 64ch; margin: 0; font-size: 15px; line-height: 1.55; }
.statusrow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; margin-top: 9px; }
.fit { flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.45; color: var(--muted-foreground); margin: 0; }
.fit span { white-space: nowrap; }
.rowbottom { display: flex; justify-content: flex-end; align-items: center; margin-top: 10px; }
.votes { display: flex; flex: none; gap: 6px; }
.vote { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 51px; height: 30px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted-foreground); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; transition: background-color .2s var(--ease-out),color .2s var(--ease-out),border-color .2s var(--ease-out),transform .2s var(--ease-out); }
.vote:not(:disabled):hover { border-color: color-mix(in srgb,#24372f 35%,transparent); }
.vote:not(:disabled):active { transform: scale(.94); }
.vote.up[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fffaf2; }
.vote.down[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: #fffaf2; }
.vote.bump svg { animation: bump .4s var(--ease-out); }
@keyframes bump { 35% { transform: scale(1.28) rotate(-9deg); } }
.sidevotes { display: none; }
.lead { display: none; }
.check { flex: none; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border-radius: 7px; border: 1.5px solid color-mix(in srgb,#24372f 35%,transparent); background: var(--card); color: #fffaf2; transition: background-color .2s var(--ease-out),border-color .2s var(--ease-out),transform .2s var(--ease-out); }
.check[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
.check svg { opacity: 0; transform: scale(.5); transition: opacity .2s var(--ease-out),transform .3s var(--ease-out); }
.check[aria-checked="true"] svg { opacity: 1; transform: scale(1); }
.check:disabled { opacity: .32; cursor: default; }
.check:active:not(:disabled) { transform: scale(.9); }
.mobilecheck { margin-left: auto; }
/* ---------- selection bar + toast ---------- */
.actionbar { position: fixed; z-index: 35; left: 10px; right: 10px; bottom: calc(79px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; max-width: 760px; margin: auto; padding: 10px 10px 10px 16px; border: 1px solid var(--border); border-radius: 18px; background: color-mix(in srgb, var(--card) 96%, transparent); box-shadow: 0 14px 34px -16px rgba(31,48,41,.5); transform: translateY(140%); opacity: 0; transition: transform .45s var(--ease-out), opacity .3s var(--ease-out); pointer-events: none; }
.actionbar.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
.bulkcopy { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: 14px; line-height: 1.4; font-weight: 700; font-variant-numeric: tabular-nums; }
.bulkcopy small { color: var(--muted-foreground); font-size: 12px; font-weight: 600; line-height: 1.3; }
.actionbar .primarybtn { flex: none; min-height: 44px; height: 44px; padding: 0 14px; font-size: 15px; box-shadow: none; }
.primarybtn { height: 50px; padding: 0 28px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-foreground); font-weight: 700; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 10px 28px -10px rgba(31,48,41,.55); transition: transform .2s var(--ease-out), opacity .2s; }
.primarybtn:disabled { opacity: .45; cursor: default; }
.primarybtn:not(:disabled):active { transform: scale(.97); }
.sheetfoot .primarybtn { width: 100%; height: auto; min-height: 44px; padding: 9px 18px; font-size: 15px; line-height: 1.35; white-space: normal; box-shadow: none; }
.headside .headprimary { min-height: 44px; height: 44px; padding: 0 18px; gap: 7px; font-size: 15px; font-weight: 700; box-shadow: none; }
.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100vw - 24px); padding: 10px 12px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); font-weight: 700; font-size: 14px; box-shadow: 0 14px 34px -12px rgba(31,48,41,.6); transform: translate(-50%, 30px) scale(.96); opacity: 0; pointer-events: none; transition: transform .5s var(--ease-out), opacity .35s var(--ease-out); }
.toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.toast .badge { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.toastmessage { min-width: 0; line-height: 1.35; white-space: normal; }
.toastaction { flex: none; padding: 8px 4px; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; pointer-events: auto; }
.toast .badge path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.toast.show .badge path { animation: draw .5s .15s var(--ease-out) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.row.just-scheduled { animation: settle 1.2s var(--ease-out); }
@keyframes settle { 0% { background-color: color-mix(in srgb, var(--accent) 18%, var(--card)); } 100% { background-color: color-mix(in srgb, var(--primary) 6%, var(--card)); } }

/* ---------- place detail: bottom sheet (phone) / side panel (desktop) ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(31,48,41,.32); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); }
.scrim.show { opacity: 1; pointer-events: auto; }

.sheet .grab { width: 40px; height: 5px; border-radius: 999px; background: color-mix(in srgb, #24372f 18%, transparent); margin: 8px auto 0; flex: none; }
.sheethead { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px 12px; flex: none; }

.iconbtn { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); padding: 0; }
/* Fixed-height detail: header and footer stay put, the body scrolls. Edge shadows appear only when there is more to scroll. */
.sheetbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 20px;
  background:
    linear-gradient(var(--card) 30%, transparent) top / 100% 28px no-repeat local,
    linear-gradient(transparent, var(--card) 70%) bottom / 100% 28px no-repeat local,
    radial-gradient(farthest-side at 50% 0, rgba(31,48,41,.16), transparent) top / 100% 10px no-repeat scroll,
    radial-gradient(farthest-side at 50% 100%, rgba(31,48,41,.16), transparent) bottom / 100% 10px no-repeat scroll,

.detailphoto { width: 100%; aspect-ratio: 16/9; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: color-mix(in srgb,var(--primary) 6%,var(--card)); }
.detailphoto img { width: 100%; height: 100%; object-fit: cover; }
.detailphoto .nophoto { font-size: 13px; }
.sec { padding: 16px 0; }
.sec + .sec { border-top: 1px solid var(--border); }
.sec h3 { font-size: 13px; font-weight: 700; color: var(--muted-foreground); margin: 0 0 10px; }
.where { display: grid; gap: 6px; font-size: 14px; line-height: 1.5; }
.where .far { font-weight: 700; color: var(--accent-ink); }
.maplink { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--foreground); text-underline-offset: 3px; }
.reasons { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.reasons li { font-size: 15px; line-height: 1.65; }
.cite { display: inline-block; margin-left: 4px; font-size: 12px; font-weight: 600; color: var(--muted-foreground); white-space: nowrap; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; line-height: 1.55; }
.notes li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.notes li svg { margin-top: 2px; color: var(--muted-foreground); }
.notes .unknown { color: var(--muted-foreground); }
details.sources summary { cursor: pointer; font-size: 14px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 6px; }
details.sources summary::-webkit-details-marker { display: none; }
details.sources summary svg { transition: transform .25s var(--ease-out); }

details.sources a { color: var(--foreground); text-underline-offset: 3px; }
.sheetfoot { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--card); }
.sheetfoot .label { font-size: 13px; color: var(--muted-foreground); flex: 1; }
.textdanger { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border: 0; background: none; padding: 8px 0; font-size: 14px; font-weight: 600; color: #b55737; text-decoration: underline; text-underline-offset: 3px; }
.sheetfoot.placeactions { flex-wrap: wrap; }
.detailbuttons { flex: 1 1 250px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.schedulefoot .primarybtn { width: 100%; }
.detailadd { min-height: 44px; height: 44px; padding: 0 16px; font-size: 14px; box-shadow: none; }
.daypicker { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 5px; padding: 4px; margin: 8px 0 10px; border: 1px solid var(--border); border-radius: 15px; background: color-mix(in srgb,var(--primary) 4%,var(--card)); }
.daypick { min-width: 0; min-height: 54px; padding: 5px 2px; border: 0; border-radius: 11px; background: transparent; color: var(--muted-foreground); font-size: 13px; font-weight: 700; line-height: 1.2; }
.daypick span,.daypick small { display: block; }
.daypick small { margin-top: 3px; font-size: 11px; }
.daypick[aria-pressed="true"] { background: var(--card); color: var(--accent-ink); box-shadow: 0 2px 8px -4px rgba(31,48,41,.25); }
.daypick.unschedule { grid-row: span 1; }
.confirmrow { display: none; flex-direction: column; gap: 10px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: color-mix(in srgb, #b55737 7%, var(--card)); }
.confirmrow p { margin: 0; font-size: 14px; line-height: 1.5; }
.confirmrow .btns { display: flex; gap: 8px; justify-content: flex-end; }
.dangerbtn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #b55737; color: #fffaf2; font-weight: 700; font-size: 14px; }
.sheet.confirming .sheetfoot { display: none; }
.sheet.confirming .confirmrow { display: flex; }
.row.open { background: color-mix(in srgb, var(--accent) 9%, var(--card)); }
.row:not(.selecting) { cursor: pointer; }
.row:not(.selecting):hover h2 { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

      <summary>${svg('<path d="m9 18 6-6-6-6"/>', 16)}不再推薦的地點（${rejected.length}）</summary>
      <p class="rejectedhint">AI 之後的研究不會再推薦這些地點。恢復後會回到上面的清單。</p>
      <ul>${rejected.map((p) => `<li><span class="rname">${p.name}</span><span class="chip">${p.kind}</span><span class="spacer"></span>
        <button class="ghost iconghost" type="button" data-restore="${p.id}">${svg(icon.undo, 16)}<span>恢復推薦</span></button></li>`).join("")}</ul></details>` : "";

  const bar = $("actionbar");
  bar.classList.toggle("show", selecting);
  $("bulkcount").textContent = `已選 ${selected.size} 個`;
  $("bulkhint").textContent = "";
  $("chooseDate").disabled = selected.size === 0;
  justScheduled = new Set();
  renderSheet();
}

// ---------- place detail ----------
let openId = null;
let confirming = false;
function km(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function openSchedule(ids, change = false, trigger = null) {
  scheduleIds = [...ids];
  selectedDay = null;
  changingDate = change;
  if (openId !== null) {
    openId = "schedule";
    renderSheet();
    $("sheettitle")?.focus({ preventScroll: true });
  } else {
    openSheet("schedule", trigger);
  }
}
function renderSchedule() {
  const chosen = places.filter((p) => scheduleIds.includes(p.id));
  const names = chosen.map((p) => p.name).join("、");
  const single = chosen.length === 1;
  const label = selectedDay && selectedDay !== "none" ? dayLabel(selectedDay) : null;
  let buttonLabel = "先選擇日期";
  if (selectedDay === "none") buttonLabel = `將「${chosen[0]?.name || ""}」設為先不安排`;
  else if (label) buttonLabel = single ? `將「${chosen[0].name}」排入 ${label}` : `將 ${chosen.length} 個地點排入 ${label}`;
  $("sheet").classList.remove("confirming");
  $("sheet").innerHTML = `<div class="grab" aria-hidden="true"></div>
    <div class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">排入行程</h2><p>${names}</p></div>
      <button class="iconbtn" type="button" data-close aria-label="關閉">${svg(icon.x, 20)}</button></div>
    <div class="sheetbody"><div class="sec" style="padding-top:4px"><h3>選擇日期</h3>
      <div class="daypicker" aria-label="排入哪一天">${changingDate ? `<button class="daypick unschedule" type="button" data-day="none" aria-pressed="${selectedDay === "none"}"><span>先不安排</span><small>保留在行程</small></button>` : ""}${days.map((day) => `<button class="daypick" type="button" data-day="${day[0]}" aria-pressed="${selectedDay === day[0]}"><span>${day[0]}</span><small>${day[1]}</small></button>`).join("")}</div>
    </div></div>
    <div class="sheetfoot schedulefoot"><button class="primarybtn" id="confirmSchedule" type="button" ${selectedDay ? "" : "disabled"}>${buttonLabel}</button></div>`;
}
function confirmSchedule() {
  if (!selectedDay) return;
  const chosen = places.filter((p) => scheduleIds.includes(p.id));
  if (selectedDay === "none") {
    chosen.forEach((p) => { p.day = null; });
    closeSheet();
    showToast(`已將「${chosen[0].name}」設為先不安排`);
    return;
  }
  chosen.forEach((p) => { p.day = selectedDay; });
  const label = dayLabel(selectedDay);
  justScheduled = new Set(chosen.map((p) => p.id));
  selected.clear();
  selecting = false;
  const sheet = $("sheet");
  sheet.classList.remove("show");
  $("scrim").classList.remove("show");
  openId = null;
  setTimeout(() => { if (openId === null) sheet.hidden = true; }, 450);
  render();
  showToast(`已將 ${chosen.length} 個地點排入 ${label}`, true);
}
function renderSheet() {
  const sheet = $("sheet");
  if (openId === "schedule") {
    renderSchedule();
    return;
  }
  if (openId === "questions") {
    sheet.classList.remove("confirming");
    const list = gateQuestions();
    const editing = questionsEditAll;
    sheet.innerHTML = `
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">${editing ? "修改回答" : `AI 想先確認 ${list.length} 件事`}</h2>
        <p class="sheetsub">${editing ? "" : "開始找之前先問清楚。"}你的選擇會改變 AI 搜尋的地區與地點類型；沒有選的題目會當作「不知道」。</p></div>
        <button class="iconbtn" type="button" data-close aria-label="取消">${svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 18)}</button></div>
      <div class="sheetbody"><div class="sec" style="padding-top:4px;display:grid;gap:22px">${questionFields(list)}</div></div>
      <div class="sheetfoot"><span class="label">${editing ? "送出後，AI 會依新的回答重新找一次。" : "送出後，AI 會照你的回答開始找。"}</span><button class="primarybtn small iconaction" type="button" id="submitanswers">${svg(icon.send, 18)}<span>${editing ? "送出並更新建議" : "送出並開始找"}</span></button></div>`;
    return;
  }
  if (openId === "brief") {
    sheet.classList.remove("confirming");
    const answered = questions.filter((q) => q.done);
    sheet.innerHTML = `
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><div style="flex:1;min-width:0"><h2 id="sheettitle" tabindex="-1">你的需求</h2></div>
        <button class="iconbtn" type="button" data-close aria-label="關閉">${svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 18)}</button></div>
      <div class="sheetbody"><div class="sec" style="padding-top:4px">${briefForm("brief-edit")}</div>
        ${answered.length ? `<div class="sec"><details class="sources"><summary>${svg('<path d="m9 18 6-6-6-6"/>', 16)}AI 問過的 ${answered.length} 個問題</summary>
          <ul class="answered">${answered.map((q) => `<li><span class="qtext small">${q.text}</span><span class="${q.choice === "unknown" ? "unknownans" : ""}">${answerText(q)}</span></li>`).join("")}</ul>
          <button class="ghost iconghost" type="button" id="editanswers" style="margin-top:12px">${svg(icon.pencilLine, 16)}<span>修改回答</span></button></details></div>` : ""}
      </div>
      <div class="sheetfoot"><span class="label">改完後，AI 會依新的需求重新找一次。</span><button class="primarybtn small iconaction" type="button" id="runresearch" ${brief.trim() ? "" : "disabled"}>${svg(icon.rotate, 18)}<span>更新 AI 建議</span></button></div>`;
    return;
  }
  const p = places.find((x) => x.id === openId);
  if (!p) return;
  const d = km(LODGING, p);
  const distance = d >= 30
    ? `<span class="far">離住宿直線約 ${Math.round(d)} 公里，需要另外安排一天</span>`
    : `<span>離住宿直線約 ${d.toFixed(1)} 公里</span>`;
  sheet.classList.toggle("confirming", confirming);
  sheet.innerHTML = `
    <div class="grab" aria-hidden="true"></div>
    <div class="sheethead">
      <div style="flex:1;min-width:0">
        <h2 id="sheettitle" tabindex="-1">${p.name}</h2>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="chip">${p.kind}</span>${p.day ? `<span class="scheduledtag">${svg(icon.calendarCheck, 15)}已排入 ${dayLabel(p.day)}</span>` : ""}</div>
      </div>
      <button class="iconbtn" type="button" data-close aria-label="關閉">${svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 18)}</button>
    </div>
    <div class="sheetbody">
      ${thumb(p, true)}
      <div class="sec">
        <h3>為什麼推薦</h3>
        <ul class="reasons">${p.reasons.map(([t, s]) => `<li>${t}<span class="cite">— ${s}</span></li>`).join("")}</ul>
      </div>
      <div class="sec">
        <h3>在哪裡</h3>
        <div class="where"><span>${p.area}</span>${distance}
          <a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${p.name} ${p.area} 日本`)}${p.googlePlaceId ? `&query_place_id=${encodeURIComponent(p.googlePlaceId)}` : ""}" target="_blank" rel="noreferrer">${svg('<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>', 16)}在 Google Maps 開啟</a></div>
      </div>
      ${p.cautions.length || p.unknowns.length ? `<div class="sec">
        <h3>要注意</h3>
        <ul class="notes">
          ${p.cautions.map((c) => `<li>${svg('<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>', 15)}<span>${c}</span></li>`).join("")}
          ${p.unknowns.map((u) => `<li class="unknown">${svg('<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>', 15)}<span>還不確定：${u}</span></li>`).join("")}
        </ul>
      </div>` : ""}
      <div class="sec">
        <h3>符合你的需求</h3>
        <p style="margin:0;font-size:14px;line-height:1.6">${p.fit.join("・")}</p>
      </div>
      <div class="sec">
        <details class="sources"><summary>${svg('<path d="m9 18 6-6-6-6"/>', 16)}${p.sources.length} 個來源</summary>
          <ul>${p.sources.map((s) => `<li>${s}</li>`).join("")}</ul>
        </details>
      </div>
    </div>
    <div class="sheetfoot placeactions">
      ${voteButtons(p)}
      <div class="detailbuttons">
        <button class="textdanger" type="button" data-reject>${svg(icon.ban, 16)}<span>不要再推薦</span></button>
        ${isTripCreator ? `<button class="primarybtn detailadd iconaction" type="button" data-detail-schedule="${p.id}">${svg(icon.calendarPlus, 16)}<span>${p.day ? "更改日期" : "排入行程"}</span></button>` : ""}
      </div>
    </div>
    <div class="confirmrow" role="alertdialog" aria-label="確認不要再推薦">
      <p><strong>${p.name}</strong> 會從 AI 建議移除，之後的研究也不會再推薦它。如果按錯，可以在清單最下面的「不再推薦的地點」恢復。</p>
      <div class="btns"><button class="ghost iconghost" type="button" data-reject-cancel>${svg(icon.arrowLeft, 16)}<span>返回</span></button><button class="dangerbtn" type="button" data-reject-confirm>${svg(icon.ban, 16)}<span>不要再推薦</span></button></div>
    </div>`;
}
let lastRow = null;
function openSheet(id, row) {
  openId = id; confirming = false; lastRow = row;
  const sheet = $("sheet");
  sheet.hidden = false;
  render();
  requestAnimationFrame(() => { sheet.classList.add("show"); $("scrim").classList.add("show"); $("sheettitle")?.focus({ preventScroll: true }); });
}
function closeSheet() {
  const sheet = $("sheet");
  sheet.classList.remove("show"); $("scrim").classList.remove("show");
  const id = openId; openId = null; confirming = false;
  // Closing the pre-search questions cancels that search; nothing was searched yet.
  if (id === "questions") { gate = null; questionsEditAll = false; }
  render();
  setTimeout(() => { if (openId === null) sheet.hidden = true; }, 450);
  (id === "brief" ? $("openbrief") : id === "questions" ? ($("openquestions") ?? $("openbrief")) : document.querySelector(`[data-row="${id}"]`))?.focus({ preventScroll: true });
}
let revealing = false;
// Demo switch: ?fail=model | places | limit | busy makes the FIRST search fail that way; 再試一次 then succeeds.
// These are the four real outcomes the backend can return when a search does not complete
// (model_unavailable, provider_unavailable, research_limit_reached: 6 per trip / 10 per member per hour, research_in_progress).
let failMode = new URLSearchParams(location.search).get("fail");
let failure = null;
let retrying = false;
const FAILURE_COPY = {
  model: { title: "這次沒找成", reason: "AI 研究服務暫時無法使用。", retry: true },
  places: { title: "這次沒找成", reason: "地點查證服務（Google 地圖）暫時無法使用，AI 沒辦法確認地點是真的。", retry: true },
  limit: { title: "這一小時已經找了 6 次", reason: "每趟旅程每小時最多找 6 次，約 23 分鐘後可以再找。", retry: false },
};
function failureBox(kind, first) {
  const f = FAILURE_COPY[kind];
  const kept = first ? "你的需求已經保留。" : "原本的建議都還在，沒有任何變動。";
  return `<div class="failbox" role="alert">${svg('<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>', 18)}
    <div class="failtext"><strong>${f.title}</strong><span>${f.reason}${kept}</span></div>
    ${f.retry && !first ? retryControl("retryresearch", "ghost") : ""}</div>`;
}
function showToast(text, itineraryAction = false, keep = false) {
  $("toasttext").textContent = text;
  $("toastaction").hidden = !itineraryAction;
  const t = $("toast");
  t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  clearTimeout(window.__toast);
  if (!keep) window.__toast = setTimeout(() => t.classList.remove("show"), 4800);
}
function startResearch(isRetry = false) {
  const wasFirst = firstRun;
  const fail = isRetry ? null : failMode; failMode = null; // a retry succeeds in this prototype
  if (!isRetry) failure = null;
  if (fail === "limit") { failure = "limit"; render(); return; } // refused up front: nothing runs
  retrying = isRetry;
  researching = fail === "busy" ? "busy" : true;
  render();
  if (wasFirst) $("list").scrollIntoView({ block: "nearest" });
  // Prototype only: pretend the research run finishes after a moment.
  setTimeout(() => {
    researching = false;
    retrying = false;
    if (fail === "model" || fail === "places") { failure = fail; render(); return; }
    failure = null;
    if (wasFirst) { firstRun = false; revealing = true; }
    render();
    if (wasFirst) {
      showToast(`找到 ${places.filter((p) => !p.rejected).length} 個地點`);
      setTimeout(() => { revealing = false; }, 1200);
    }
  }, 3500);
}
document.addEventListener("input", (e) => {
  if (e.target.matches("textarea.brief")) {
    brief = e.target.value;
    // Searching needs something to search for: the button wakes up as soon as there is text.
    for (const id of ["startresearch", "runresearch"]) { const b = $(id); if (b) b.disabled = !brief.trim(); }
  }
  if (e.target.matches("textarea.qanswer")) {
    const q = questions.find((x) => x.id === Number(e.target.dataset.q));
    q.custom = e.target.value;
  }
});
document.addEventListener("change", (e) => {
  if (!e.target.matches('input[type="radio"][data-q]')) return;
  const q = questions.find((x) => x.id === Number(e.target.dataset.q));
  q.choice = e.target.value; q.error = false;
  if (openId === "questions") renderSheet(); else render();
  if (q.choice === "custom") document.querySelector(`textarea.qanswer[data-q="${q.id}"]`)?.focus();
  else document.querySelector(`input[name="q${q.id}"][value="${q.choice}"]`)?.focus();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openId !== null) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".row[tabindex]")) { e.preventDefault(); openSheet(Number(e.target.dataset.row), e.target); }
});

document.addEventListener("click", (e) => {
  const vote = e.target.closest("[data-vote]");
  if (vote) {
    e.stopPropagation();
    const p = places.find((x) => x.id === Number(vote.dataset.id));
    const kind = vote.dataset.vote;
    if (p.mine === kind) { p[kind]--; p.mine = null; }
    else { if (p.mine) p[p.mine]--; p[kind]++; p.mine = kind; }
    render();
    document.querySelectorAll(`[data-id="${p.id}"][data-vote="${kind}"]`).forEach((b) => { if (p.mine === kind) b.classList.add("bump"); });
    return;
  }
  if (e.target.closest("#openbrief")) { openSheet("brief", null); return; }
  if (e.target.closest("#editanswers")) { questionsEditAll = true; openId = "questions"; renderSheet(); $("sheettitle")?.focus(); return; }
  if (e.target.closest("#submitanswers")) {
    if (!validateAnswers()) {
      if (openId === "questions") renderSheet(); else render();
      document.querySelector(".qerror")?.closest(".customwrap")?.querySelector("textarea")?.focus();
      return;
    }
    const wasEditing = questionsEditAll;
    if (!wasEditing) answerGate();
    questionsEditAll = false;
    if (openId === "questions") closeSheet();
    startResearch();
    return;
  }
  if (e.target.closest("#backtobrief")) { gate = null; render(); $("brief-first")?.focus(); return; }
  if (e.target.closest("#runresearch")) { closeSheet(); requestResearch(); return; }
  if (e.target.closest("#retryresearch, #retryresearch2")) { startResearch(true); return; }
  if (e.target.closest("#editafterfail")) { failure = null; render(); $("brief-first")?.focus(); return; }
  if (e.target.closest("#startresearch")) { if (brief.trim()) requestResearch(); return; }
  if (e.target.closest("#select")) {
    selecting = true;
    selected.clear();
    render();
    return;
  }
  if (e.target.closest("#cancel")) { selecting = false; selected.clear(); render(); return; }
  if (e.target.closest("#chooseDate") && !$("chooseDate").disabled) {
    openSchedule(selected, false, e.target);
    return;
  }
  const detailSchedule = e.target.closest("[data-detail-schedule]");
  if (detailSchedule) {
    const p = places.find((x) => x.id === Number(detailSchedule.dataset.detailSchedule));
    if (!p) return;
    openSchedule([p.id], !!p.day, detailSchedule);
    return;
  }
  const day = e.target.closest("[data-day]");
  if (day) {
    selectedDay = day.dataset.day;
    renderSchedule();
    document.querySelector(`[data-day="${selectedDay}"]`)?.focus();
    return;
  }
  if (e.target.closest("#confirmSchedule")) { confirmSchedule(); return; }
  if (e.target.closest("[data-close]") || e.target === $("scrim")) { closeSheet(); return; }
  if (e.target.closest("[data-reject]")) { confirming = true; renderSheet(); return; }
  if (e.target.closest("[data-reject-cancel]")) { confirming = false; renderSheet(); return; }
  if (e.target.closest("[data-reject-confirm]")) {
    const p = places.find((x) => x.id === openId);
    p.rejected = true;
    closeSheet();
    showToast(`已不再推薦「${p.name}」`);
    return;
  }
  const restore = e.target.closest("[data-restore]");
  if (restore) {
    const p = places.find((x) => x.id === Number(restore.dataset.restore));
    p.rejected = false;
    justScheduled.add(p.id); // reuse the brief highlight so the member sees where it came back
    render();
    document.querySelector(`[data-row="${p.id}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
    showToast(`已恢復推薦「${p.name}」`);
    return;
  }
  const row = e.target.closest(".row.is-selectable");
  if (row && selecting) {
    const id = Number(row.dataset.row);
    selected.has(id) ? selected.delete(id) : selected.add(id);
    render();
    return;
  }
  const openRow = e.target.closest(".row");
  if (openRow && !selecting && !e.target.closest("a, button")) openSheet(Number(openRow.dataset.row), openRow);
});
// Direct demo states supplement all existing ?state=empty and ?fail=… URLs.
if (demoState === "selecting" && !firstRun && isTripCreator) {
  selecting = true;
  selected.add(2);
}
if (demoState === "sheet" && !firstRun && isTripCreator) {
  selecting = true;
  selected.add(2);
  selected.add(3);
}
if (demoState === "done" && !firstRun && isTripCreator) {
  places.find((p) => p.id === 2).day = "10/23";
  places.find((p) => p.id === 3).day = "10/23";
  justScheduled = new Set([2, 3]);
}
if (failMode) {
  if (firstRun && !brief) brief = "想在京都看紅葉";
  if (failMode === "busy") startResearch();
  else { failure = failMode; failMode = null; render(); }
} else {
  render();
  if (demoState === "sheet" && !firstRun && isTripCreator) openSchedule(selected, false);
  if (demoState === "done" && !firstRun && isTripCreator) requestAnimationFrame(() => showToast("已將 2 個地點排入 10/23（週五）", true, true));
}
</script>
