name: along-the-way

x-migration-environment: &migration-environment
  DATABASE_URL: "postgresql://${POSTGRES_ADMIN_USER:-along_the_way_admin}:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}@db:5432/${POSTGRES_DB:-along_the_way}"
  BOOTSTRAP_OWNER_EMAIL: "${BOOTSTRAP_OWNER_EMAIL:?Set BOOTSTRAP_OWNER_EMAIL in .env}"

x-app-environment: &app-environment
  DATABASE_URL: "postgresql://${APP_DATABASE_USER:-along_the_way_app}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}@db:5432/${POSTGRES_DB:-along_the_way}"
  SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
  TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET in .env}"

x-worker-environment: &worker-environment
  <<: *app-environment
  SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST in .env}"
  SMTP_PORT: "${SMTP_PORT:?Set SMTP_PORT in .env}"
  EMAIL_FROM: "${EMAIL_FROM:?Set EMAIL_FROM in .env}"
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  SMTP_REQUIRE_TLS: "${SMTP_REQUIRE_TLS:-true}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgis/postgis:17-3.5-alpine@sha256:fae81f3e8da88b8e684c58c8a8616aadda72e6fc1affcb050b490891ecb3db1c
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-along_the_way}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-along_the_way_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    pids_limit: 128
    logging: *default-logging
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private

  migrate:
    image: "along-the-way-api:${RELEASE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *migration-environment
    command:
      [
        "sh",
        "-c",
        "bun apps/api/src/database/migrate.ts && bun apps/api/src/database/seed.ts",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    pids_limit: 128
    logging: *default-logging
    networks:
      - private

  provision-app-role:
    image: postgis/postgis:17-3.5-alpine@sha256:fae81f3e8da88b8e684c58c8a8616aadda72e6fc1affcb050b490891ecb3db1c
    user: postgres
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-along_the_way}"
      PGUSER: "${POSTGRES_ADMIN_USER:-along_the_way_admin}"
      PGPASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
      APP_DATABASE_USER: "${APP_DATABASE_USER:-along_the_way_app}"
      APP_DATABASE_PASSWORD: "${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}"
    command: ["sh", "/provision-app-role.sh"]
    volumes:
      - ./infra/postgres/provision-app-role.sh:/provision-app-role.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    pids_limit: 64
    logging: *default-logging
    networks:
      - private

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    expose:
      - "1025"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging
    networks:
      - private

  worker:
    image: "along-the-way-api:${RELEASE_IMAGE_TAG:-local}"
    restart: unless-stopped
    environment: *worker-environment
    command: ["bun", "apps/api/src/email-worker.ts"]
    depends_on:
      provision-app-role:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging
    networks:
      - private
      - worker-egress

  api:
    image: "along-the-way-api:${RELEASE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: "3000"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.5}"
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:?Set CREDENTIALS_ENCRYPTION_KEY to base64 of 32 random bytes}"
      FAKE_EXTERNAL_DATA: "${FAKE_EXTERNAL_DATA:-}"
    depends_on:
      provision-app-role:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/ready'); if (!response.ok) process.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 512m
    pids_limit: 128
    logging: *default-logging
    networks:
      - edge
      - private

  web:
    image: "along-the-way-web:${RELEASE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4173"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:4173'); if (!response.ok) process.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    expose:
      - "4173"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 128m
    pids_limit: 64
    logging: *default-logging
    networks:
      - edge

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 128m
    pids_limit: 128
    logging: *default-logging
    networks:
      - edge

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
  worker-egress:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
