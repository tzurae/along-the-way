name: Verify

on:
  push:
    branches: ["feat/**"]
  pull_request:
  # Deploy accepts a main commit whose tree already passed Verify on a PR. Run this
  # manually on main only when main's tree differs from every verified PR head.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine@sha256:fae81f3e8da88b8e684c58c8a8616aadda72e6fc1affcb050b490891ecb3db1c
        env:
          POSTGRES_DB: along_the_way_test
          POSTGRES_USER: along_the_way_test
          POSTGRES_PASSWORD: integration-test-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U along_the_way_test -d along_the_way_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://along_the_way_test:integration-test-secret@localhost:5432/along_the_way_test

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build

  compose-smoke:
    # Each shard runs on its own runner with its own compose stack (DB, Mailpit), so the
    # serial e2e suite splits across jobs without the tests sharing state.
    name: compose-smoke (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    env:
      RUN_BROWSER_TESTS: "1"
      E2E_SHARD: ${{ matrix.shard }}/3
      RELEASE_IMAGE_TAG: ci
      SMOKE_PREBUILT_IMAGES: "1"
      SMOKE_OPERATIONS_DRILL: ${{ matrix.shard == 1 && '1' || '0' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: along-the-way-api:ci
          load: true
          cache-from: type=gha,scope=api
          # Only shard 1 exports: concurrent GHA cache writers fail with "error writing layer blob".
          cache-to: ${{ matrix.shard == 1 && 'type=gha,scope=api,mode=max,ignore-error=true' || '' }}
      - name: Build web image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          tags: along-the-way-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: ${{ matrix.shard == 1 && 'type=gha,scope=web,mode=max,ignore-error=true' || '' }}
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium
      - run: sh ./scripts/smoke-compose.sh
