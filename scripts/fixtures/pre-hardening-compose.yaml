name: along-the-way

x-app-environment: &app-environment
  DATABASE_URL: "postgresql://${APP_DATABASE_USER:-along_the_way_app}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@db:5432/${POSTGRES_DB:-along_the_way}"
  SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
  TOKEN_SECRET: "${TOKEN_SECRET:?Set TOKEN_SECRET}"

services:
  provision-app-role:
    image: postgis/postgis:17-3.5-alpine@sha256:fae81f3e8da88b8e684c58c8a8616aadda72e6fc1affcb050b490891ecb3db1c
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-along_the_way}"
      PGUSER: "${POSTGRES_ADMIN_USER:-along_the_way_admin}"
      PGPASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}"
      APP_DATABASE_USER: "${APP_DATABASE_USER:-along_the_way_app}"
      APP_DATABASE_PASSWORD: "${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}"
    command: ["sh", "/provision-app-role.sh"]
    volumes:
      - ./infra/postgres/provision-app-role.sh:/provision-app-role.sh:ro
    networks:
      - private

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    expose:
      - "1025"
    networks:
      - private

  worker:
    image: "along-the-way-api:${RELEASE_IMAGE_TAG:?Set RELEASE_IMAGE_TAG}"
    restart: unless-stopped
    environment:
      <<: *app-environment
      SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:?Set SMTP_PORT}"
      EMAIL_FROM: "${EMAIL_FROM:?Set EMAIL_FROM}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_REQUIRE_TLS: "${SMTP_REQUIRE_TLS:-false}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    command: ["bun", "apps/api/src/email-worker.ts"]
    networks:
      - private

  api:
    image: "along-the-way-api:${RELEASE_IMAGE_TAG:?Set RELEASE_IMAGE_TAG}"
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: "3000"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.5}"
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      FAKE_EXTERNAL_DATA: "${FAKE_EXTERNAL_DATA:-}"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/ready'); if (!response.ok) process.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - private

  web:
    image: "along-the-way-web:${RELEASE_IMAGE_TAG:?Set RELEASE_IMAGE_TAG}"
    restart: unless-stopped
    environment:
      PORT: "4173"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:4173'); if (!response.ok) process.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - private

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
